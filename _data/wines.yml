# Wines shown on the /le-mie-passioni/ interactive map (rendered by _includes/wine_map.liquid).
#
# Add wines with the "Scheda di degustazione" form and `ruby bin/sync-wines` (merge/upsert
# — it only touches wines the form mentions). Setup: bin/wines-sync.md. Hand-editing works too.
#
# Compact fields (all optional except name/producer): name, producer, url, denominazione,
# territorio, region, country, lat, lng, vintage, grape, price, color, sparkling, rating,
# tasted ("YYYY-MM-DD"), notes, pairing.
#   color  : red | white | rosé | sparkling | orange   (bottle marker tint; derived from Tipologia)
#   rating : 1 to 5
# An optional `tasting:` block (visual / nose / palate) powers the "Vedi valutazione
# completa" button in the popup — see the first entry.
#
# The popup has an IT/EN toggle; English is produced on the fly by Google Translate and
# cached in the browser, so keep everything here in Italian.
#
# The finder under the map derives type / region / price / occasion / food tags from the
# fields above. To override the guessed ones, add optional lists `occasions:` and
# `food_tags:` to an entry (e.g. occasions: [aperitivo, estate]).
#
# The entries below are examples — replace them with your own tastings.

