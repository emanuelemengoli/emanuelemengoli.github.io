# Wines shown on the /le-mie-passioni/ interactive map (rendered by _includes/wine_map.liquid).
#
# One entry per wine. Required: name, producer, url, region, country, lat, lng, color, rating.
# Optional: vintage, grape, notes, tasted.
#
#   color   : red | white | rosé | sparkling | orange   (sets the bottle marker tint)
#   rating  : 0 to 5, in 0.5 steps
#   lat/lng : decimal degrees of the producer / winery
