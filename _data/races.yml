# Races shown on the /le-mie-passioni/ races section (rendered by
# _includes/race_finder.liquid and _includes/race_map.liquid).
#
# This file is regenerated automatically — don't hand-maintain entries beyond an
# occasional correction. A scheduled GitHub Action (.github/workflows/sync-races.yml)
# runs `ruby bin/sync-races` monthly, re-fetching every source under bin/race_sources/
# and opening a pull request with the result; merging that PR is the only manual step.
# Source list, setup and the one-time repo settings this needs: bin/races-sync.md.
#
# Rolling feed, not an archive: on every run, any existing entry whose `date` is more
# than 7 days in the past is dropped, so this file only ever holds upcoming races.
# Entries from a source no longer configured in bin/sync-races' SOURCES list are dropped
# too, rather than lingering forever with a stale last_synced.
#
# Fields (all optional except name/date/category/source/source_url):
#   name          race name
#   date          "YYYY-MM-DD", the race's (first) start date — together with name and
#                 country, the key a re-sync uses to update rather than duplicate an entry
#   category      trail | ultra | triathlon | road | skyrun
#   country       Italia | Francia | Spagna | Svizzera | Austria — kept in Italian, like
#                 wines.yml, since both sections share one page-level IT->EN translator
#   region        sub-country region/province/city, when the source states one
#   distance_km   headline distance; use distances_km (a list) instead when one listing
#                 genuinely bundles several distances under a single entry
#   elevation_gain_m, difficulty   best-effort, populated only when the source has them
#                 (mainly trail/ultra) — never required, and a missing value never
#                 excludes a race from a search
#   lat, lng      geocoded from name/region/country
#   price         free text ("€ 30" or similar); almost never populated today — none of
#                 the sources under bin/race_sources/ publish entry fees
#   organizer, url, notes, series
#   source        which adapter in bin/race_sources/ produced this entry (traceability)
#   source_url    the page/feed the adapter actually read
#   last_synced   "YYYY-MM-DD" this entry was last confirmed present by a sync run

